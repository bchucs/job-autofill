<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #333;
      background: #fff;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .icon-btn:hover {
      background: rgba(255,255,255,0.3);
    }

    .content {
      padding: 16px;
      max-height: 400px;
      overflow-y: auto;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status.loading {
      background: #f0f4ff;
      color: #4a5568;
    }

    .status.success {
      background: #f0fff4;
      color: #276749;
    }

    .status.warning {
      background: #fffaf0;
      color: #c05621;
    }

    .status.error {
      background: #fff5f5;
      color: #c53030;
    }

    .field-list {
      margin-bottom: 16px;
    }

    .field-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .field-item:last-child {
      border-bottom: none;
    }

    .field-label {
      font-weight: 500;
      color: #4a5568;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .field-value {
      color: #2d3748;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
    }

    .field-value.missing {
      color: #a0aec0;
      font-style: italic;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #718096;
      margin: 16px 0 8px 0;
      font-weight: 600;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:disabled {
      background: #cbd5e0;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      background: #edf2f7;
      color: #4a5568;
      margin-top: 8px;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .no-profile {
      text-align: center;
      padding: 24px;
    }

    .no-profile p {
      color: #718096;
      margin-bottom: 16px;
    }

    .results {
      margin-top: 16px;
    }

    .result-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 12px;
    }

    .result-item.filled {
      color: #276749;
    }

    .result-item.skipped {
      color: #a0aec0;
    }

    .result-item.error {
      color: #c53030;
    }

    .checkmark {
      color: #48bb78;
    }

    .file-uploads {
      background: #f7fafc;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
    }

    .file-uploads-title {
      font-size: 11px;
      color: #718096;
      margin-bottom: 8px;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      padding: 4px 0;
    }

    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #edf2f7;
      color: #4a5568;
    }

    .llm-status {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      margin-bottom: 12px;
      border-radius: 6px;
      font-size: 11px;
    }

    .llm-status.active {
      background: #f0fff4;
      color: #276749;
    }

    .llm-status.inactive {
      background: #fff8e5;
      color: #975a16;
    }

    .llm-status.error {
      background: #fff5f5;
      color: #c53030;
    }

    .llm-status .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .llm-status.active .indicator {
      background: #48bb78;
    }

    .llm-status.inactive .indicator {
      background: #ecc94b;
    }

    .llm-status.error .indicator {
      background: #fc8181;
    }

    .mode-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .mode-toggle label {
      font-size: 12px;
      color: #4a5568;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-toggle input[type="checkbox"] {
      cursor: pointer;
    }

    .cache-info {
      font-size: 10px;
      color: #a0aec0;
      margin-left: auto;
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: #718096;
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Job Auto-Fill</h1>
    <div class="header-actions">
      <button class="icon-btn" id="clearCacheBtn" title="Clear Cache">&#128465;</button>
      <button class="icon-btn" id="refreshBtn" title="Refresh">&#8635;</button>
      <button class="icon-btn" id="settingsBtn" title="Settings">&#9881;</button>
    </div>
  </div>

  <div class="content">
    <div id="loading" class="status loading">
      <span>Analyzing page...</span>
    </div>

    <div id="noProfile" class="no-profile" style="display: none;">
      <p>No profile configured yet.</p>
      <button class="btn btn-primary" id="setupBtn">Set Up Profile</button>
    </div>

    <div id="noFields" class="empty-state" style="display: none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
      <p>No form fields detected on this page.</p>
    </div>

    <div id="mainContent" style="display: none;">
      <div id="llmStatus" class="llm-status inactive" style="display: none;">
        <span class="indicator"></span>
        <span id="llmStatusText">LLM: Checking...</span>
        <span id="cacheInfo" class="cache-info"></span>
      </div>

      <div class="mode-toggle">
        <label>
          <input type="checkbox" id="llmModeToggle" checked>
          Smart Fill (LLM)
        </label>
      </div>

      <div class="section-title">Detected Fields</div>
      <div class="field-list" id="fieldList"></div>

      <div id="fileUploads" class="file-uploads" style="display: none;">
        <div class="file-uploads-title">FILE UPLOADS (manual)</div>
        <div id="fileList"></div>
      </div>

      <button class="btn btn-primary" id="fillBtn">Fill Form</button>

      <div id="results" class="results" style="display: none;"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
